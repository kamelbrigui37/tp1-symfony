security:
    # Password hashing
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # User provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Firewalls
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\AppAuthenticator

            logout:
                path: app_logout
                target: app_articles

    # Access control
    # Attention : Symfony applique uniquement la première règle correspondante.
    access_control:
        # Gestion des catégories : administrateur uniquement
        - { path: ^/categories, roles: ROLE_ADMIN }

        # Création d'articles : utilisateur connecté
        - { path: ^/articles/nouveau, roles: ROLE_USER }


# Configuration pour les tests
when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
